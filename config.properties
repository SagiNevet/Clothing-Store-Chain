# ===================================================================
#  Settings of the clothing store chain system.
#  Read once when the program starts, by common.util.AppConfig.
#  Every setting here has a built in default value in the code, so the
#  system still runs correctly if this file is deleted.
# ===================================================================

# --- Network ---
# The port the server listens on. Both clients must use the same value.
server.port=5000
# The address the clients connect to. Keep localhost when everything runs
# on one laptop, or write the address of the server machine.
server.host=localhost

# --- Threads ---
# The number of business operations that may run at the same time inside
# the fixed thread pool of the server. The exact number is not critical:
# it is the mechanism that matters, not the value.
business.threadPool.size=4
# An artificial delay added to every business operation, in milliseconds.
# Zero in normal operation. Set it to about 1500 before the defence, so that two
# operations running at the same moment can be seen with the naked eye in the
# server console: their START and END lines will overlap on two thread names.
demo.taskDelayMillis=0

# --- Chat ---
# Whether the content of chat messages is written to the log.
# When false, the log still records who talked to whom, when, and from
# which branches - only the text of the messages is left out.
chat.saveMessageContent=false
# How long a chat request waits for a free employee before it is put in the
# queue, in milliseconds. A thread of the business pool is held during this
# wait, so the window is deliberately short: the queue and the notification
# cover anything longer.
chat.waitForPartnerMillis=3000

# --- Customer upgrade criteria ---
# A returning customer becomes a VIP after this many purchases,
# OR after spending this much money in total, whichever happens first.
customer.vip.minPurchases=5
customer.vip.minTotalSpent=1000
